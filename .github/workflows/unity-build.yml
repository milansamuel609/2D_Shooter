name: Unity Game Automatic Build - Multi OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Use the Unity version from your project (e.g., unity-2022.3.6f1)
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        # Updated to v4 for better security and performance
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        # v3 is the current stable version
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Unity Tests
        # v4 is the current stable version
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Note: Caching steps are not included here as game-ci actions handle them internally,
      # but the custom cleanup steps below are kept as they don't harm the process.

      - name: Clean Unity Cache
        run: |
          rm -rf ~/.cache/unity
          rm -rf ~/.local/share/unity3d

      - name: Clean docker cache
        run: |
          docker system prune -af --volumes
          docker builder prune -af

      - name: Build WebGL
        # v4 is the current stable version
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          projectPath: .
          versioning: None

      - name: Upload WebGL Build
        # v4 is the current stable version
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/webgl
